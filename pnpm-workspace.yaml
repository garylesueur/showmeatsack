# Refuse any package published less than a day ago. A compromised
# release is usually caught within hours, so waiting one day blocks
# most supply-chain attacks at no real cost.
minimumReleaseAge: 1440

# unrs-resolver ships a postinstall that fetches a native binary. Nothing
# here needs it, so it never gets to run a build script.
allowBuilds:
  unrs-resolver: false
verifyDepsBeforeRun: false
strictDepBuilds: false
